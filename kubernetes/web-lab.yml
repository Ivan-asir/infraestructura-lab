apiVersion: v1
kind: Namespace
metadata:
  name: web-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-html
  namespace: web-lab
data:
  index.html: |
    <!doctype html>
    <html lang="es">
    <head><meta charset="utf-8"><title>Laboratorio Kubernetes</title></head>
    <body>
      <h1>Laboratorio Kubernetes correcto</h1>
      <p>Aplicacion Nginx gestionada con Deployment y Service.</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-lab
  namespace: web-lab
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: web-lab
  template:
    metadata:
      labels:
        app: web-lab
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: web-html
---
apiVersion: v1
kind: Service
metadata:
  name: web-lab
  namespace: web-lab
spec:
  type: ClusterIP
  selector:
    app: web-lab
  ports:
    - name: http
      port: 80
      targetPort: 80
      
name: infraestructura-lab-docker-postgresql-imagen

services:
  db_postgres_tienda_imagen:
    container_name: db_postgres_tienda_imagen
    image: postgresql-tienda:lab
    build:
      context: ../..
      dockerfile: docker/image/Dockerfile
    restart: "no"
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - tienda_imagen:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tienda"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  tienda_imagen:

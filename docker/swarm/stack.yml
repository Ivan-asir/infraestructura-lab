version: "3.8"
services:
  web:
    image: nginx:stable-alpine
    ports:
      - target: 80
        published: 18082
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
        failure_action: pause
      rollback_config:
        parallelism: 1
      restart_policy:
        condition: on-failure
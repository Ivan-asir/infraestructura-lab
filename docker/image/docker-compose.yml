name: tienda-imagen-lab

services:
  db_postgres_tienda_imagen:
    container_name: db_postgres_tienda_imagen
    image: postgresql-tienda:lab
    build:
      context: ../..
      dockerfile: docker/image/Dockerfile
    restart: "no"
    environment:
      POSTGRES_DB: tienda
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en docker/.env}
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - pg_tienda_imagen_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tienda"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pg_tienda_imagen_data:

name: Validar repositorio
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
      - name: Validar archivos versionados
        run: bash scripts/validate-repository.sh